name: Manual Pages fallback

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Verify source
        run: |
          npm ci
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Build public artifact
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          test -n "$INDEXNOW_KEY"
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '_site/' \
            --exclude 'server/' \
            --exclude 'tests/' \
            --exclude 'tools/' \
            --exclude 'yandex-function/' \
            --exclude 'README.md' \
            --exclude 'RECOVERY.md' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude '*.py' \
            --exclude '*.pyc' \
            --exclude '*.jsx' \
            --exclude '.DS_Store'
          printf '%s' "$INDEXNOW_KEY" > "_site/${INDEXNOW_KEY}.txt"
          test -f _site/index.html
          test -f _site/CNAME
          test -f "_site/${INDEXNOW_KEY}.txt"
          test ! -d _site/node_modules
          if find _site -type f \( -name '*.py' -o -name '*.pyc' -o -name '*.jsx' \) | grep -q .; then
            echo 'Internal source leaked into the Pages artifact.'
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
