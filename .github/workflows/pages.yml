name: Deploy public site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify source
        run: |
          npm ci
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Build public artifact
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          test -n "$INDEXNOW_KEY"
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '_site/' \
            --exclude 'server/' \
            --exclude 'tests/' \
            --exclude 'tools/' \
            --exclude 'yandex-function/' \
            --exclude 'README.md' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude '*.py' \
            --exclude '*.pyc' \
            --exclude '*.jsx' \
            --exclude '.DS_Store'
          printf '%s' "$INDEXNOW_KEY" > "_site/${INDEXNOW_KEY}.txt"
          test -f _site/index.html
          test -f _site/CNAME
          test -f _site/.nojekyll
          test -f _site/.well-known/security.txt
          test -f "_site/${INDEXNOW_KEY}.txt"
          test ! -d _site/node_modules
          if find _site -type f \( -name '*.py' -o -name '*.pyc' -o -name '*.jsx' \) | grep -q .; then
            echo 'Internal source leaked into the Pages artifact.'
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
