name: Deploy public site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public artifact
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'server/' \
            --exclude 'tools/' \
            --exclude 'yandex-function/' \
            --exclude 'README.md' \
            --exclude '*.py' \
            --exclude '*.pyc' \
            --exclude '*.jsx' \
            --exclude '.DS_Store'
          test -f _site/index.html
          test -f _site/CNAME
          if find _site -type f \( -name '*.py' -o -name '*.pyc' -o -name '*.jsx' \) | grep -q .; then
            echo 'Internal source leaked into the Pages artifact.'
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
