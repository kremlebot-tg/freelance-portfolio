<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100svh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.nf-shell{width:min(1120px,calc(100% - 40px));min-height:100svh;margin:auto;display:flex;flex-direction:column}
.nf-head{min-height:96px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.nf-brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none}
.nf-brand img{width:44px;height:44px}
.nf-brand span{font:700 20px Sora,Inter,sans-serif;letter-spacing:-.04em}
.nf-lang{font:600 14px Inter,sans-serif;color:var(--text-body)}
.nf-main{flex:1;display:grid;align-items:center;padding:72px 0}
.nf-card{max-width:760px}
.nf-code{margin:0 0 18px;color:var(--accent);font:700 13px JetBrains Mono,monospace;letter-spacing:.1em;text-transform:uppercase}
h1{max-width:700px;margin:0;font:700 clamp(44px,8vw,84px)/.98 Sora,Inter,sans-serif;letter-spacing:-.065em;text-wrap:balance}
.nf-copy{max-width:610px;margin:28px 0 0;color:var(--text-body);font:400 18px/1.65 Inter,system-ui,sans-serif;text-wrap:pretty}
.nf-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.nf-button{min-height:52px;padding:0 22px;border:1px solid var(--border-input);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--text);background:var(--surface);font:650 15px Inter,sans-serif;text-decoration:none;transition:border-color .18s ease,background .18s ease}
.nf-button.primary{background:var(--accent-cta);border-color:var(--accent-cta);color:var(--accent-contrast)}
.nf-button:hover{border-color:var(--accent)}
.nf-button:focus-visible{outline:3px solid rgba(var(--accent-rgb),.28);outline-offset:3px}
.nf-foot{padding:24px 0 30px;border-top:1px solid var(--border);color:var(--text-muted);font:400 13px/1.5 Inter,sans-serif}
@media(max-width:640px){.nf-shell{width:min(100% - 28px,1120px)}.nf-head{min-height:78px}.nf-main{padding:48px 0}.nf-copy{font-size:16px}.nf-actions{display:grid}.nf-button{width:100%}}
@media(prefers-reduced-motion:reduce){.nf-button{transition:none}}
</style>
</head>

      <nav class="nf-actions" aria-label="Куда перейти">
        <a class="nf-button primary" href="/">На главную →</a>

</div>
